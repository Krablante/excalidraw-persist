services:
  excalidraw:
    build: .
    image: doska:local
    ports:
      - '4002:80' # Web client - change first number if needed
    volumes:
      - data:/app/data
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DB_PATH=/app/data/database.sqlite
    restart: unless-stopped

volumes:
  data:
    driver: local
